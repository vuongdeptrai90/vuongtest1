<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vương Hóng Hớt - Độ Nhạy FF</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#111;
color:white;
}

header{
background:linear-gradient(90deg,#ff0000,#ff8800);
padding:25px;
text-align:center;
}

.container{
width:90%;
max-width:600px;
margin:20px auto;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:0;
}

button{
background:#ff4500;
color:white;
font-weight:bold;
cursor:pointer;
}


.result{
font-size:18px;
line-height:35px;
}


.sen{
background:#333;
padding:10px;
border-radius:8px;
margin:8px 0;
}


.copy{
background:#008cff;
}


</style>

</head>


<body>


<header>

<h1>🔥 Vương Hóng Hớt FF</h1>

<p>Tool tạo độ nhạy Free Fire tham khảo</p>

</header>


<div class="container">


<div class="box">

<h2>⚙️ Tạo độ nhạy</h2>


<label>Điện thoại</label>

<select id="phone">

<option>Redmi Note 12 Turbo</option>
<option>iPhone</option>
<option>Samsung</option>
<option>OPPO</option>
<option>Vivo</option>

</select>



<label>Phong cách</label>

<select id="style">

<option value="head">Kéo tâm đỏ</option>
<option value="balance">Cân bằng</option>
<option value="smooth">Mượt</option>

</select>


<button onclick="create()">🔥 Tạo độ nhạy</button>


</div>



<div class="box result" id="result">

Chưa có cấu hình

</div>


<button class="copy" onclick="copyText()">
📋 Sao chép độ nhạy
</button>


<div class="box">

<h3>💾 Lịch sử</h3>

<div id="history">
Chưa có
</div>

</div>


</div>



<script>


let last="";


function create(){


let phone=document.getElementById("phone").value;

let type=document.getElementById("style").value;


let data;


if(type=="head"){

data={
Tổng:200,
RedDot:190,
2x:180,
4x:170,
AWM:100,
Nhìn:200
};

}


else if(type=="balance"){

data={
Tổng:170,
RedDot:160,
2x:150,
4x:140,
AWM:90,
Nhìn:170
};

}


else{

data={
Tổng:150,
RedDot:140,
2x:130,
4x:120,
AWM:80,
Nhìn:150
};

}



last=
`📱 Máy: ${phone}

🔥 Tổng: ${data.Tổng}
🔴 Red Dot: ${data.RedDot}
🔭 2X: ${data["2x"]}
🔭 4X: ${data["4x"]}
🎯 AWM: ${data.AWM}
👁 Nhìn: ${data.Nhìn}`;



document.getElementById("result").innerHTML=
last.replace(/\n/g,"<br>");



save();


}



function copyText(){

navigator.clipboard.writeText(last);

alert("Đã sao chép!");

}



function save(){

let old=localStorage.getItem("ff")||"";

localStorage.setItem("ff",last+"\n\n"+old);


show();

}



function show(){

let h=localStorage.getItem("ff")||"Chưa có";

document.getElementById("history")
.innerText=h.substring(0,500);

}


show();


</script>


</body>
</html>
